
<!DOCTYPE html>
<html lang="en" data-theme="battery">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laptop Details | CampusGear</title>

    <script>
        try {
            document.documentElement.dataset.theme =
                JSON.parse(localStorage.getItem('lf-theme')) || 'battery';
        } catch (error) {
            document.documentElement.dataset.theme = 'battery';
        }
    </script>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b backdrop-blur-xl">

        <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-4 sm:px-6 lg:px-8">

            <!-- Logo -->
            <a href="./index.html"
               class="flex items-center gap-3 text-lg font-extrabold tracking-tight">

                <span id="brand-mark"
                      class="flex h-10 w-10 items-center justify-center rounded-xl text-xl text-white">
                    ▣
                </span>

                Campus<span class="accent-text">Gear</span>
            </a>

            <!-- Desktop Navigation -->
            <nav id="desktop-nav"
                 class="hidden items-center gap-1 md:flex"
                 aria-label="Main navigation">

                <a class="nav-link" href="./index.html" data-route="index">Home</a>
                <a class="nav-link" href="./laptops.html" data-route="laptops">Explore laptops</a>
                <a class="nav-link" href="./details.html" data-route="details">Details</a>
                <a class="nav-link" href="./favorites.html" data-route="favorites">
                    Favorites <span data-fav-count>0</span>
                </a>
                <a class="nav-link" href="./compare.html" data-route="compare">Compare</a>

            </nav>

            <!-- Controls -->
            <div class="flex items-center gap-2">

                <button
                    type="button"
                    data-theme-toggle
                    class="btn-secondary whitespace-nowrap text-xs sm:text-sm">
                    ☀ Battery Saver
                </button>

                <button
                    type="button"
                    id="mobile-toggle"
                    class="btn-secondary md:hidden"
                    aria-label="Toggle navigation"
                    aria-expanded="false">
                    ☰
                </button>

            </div>

        </div>

        <!-- Mobile Navigation -->
        <nav id="mobile-nav"
             class="hidden flex-col gap-1 border-t px-4 py-3 md:hidden"
             aria-label="Mobile navigation">

            <a class="nav-link" href="./index.html" data-route="index">Home</a>
            <a class="nav-link" href="./laptops.html" data-route="laptops">Explore laptops</a>
            <a class="nav-link" href="./details.html" data-route="details">Details</a>
            <a class="nav-link" href="./favorites.html" data-route="favorites">
                Favorites <span data-fav-count>0</span>
            </a>
            <a class="nav-link" href="./compare.html" data-route="compare">Compare</a>

        </nav>

    </header>

    <!-- Main Content -->
    <main id="app"
          class="mx-auto w-full max-w-7xl px-4 pb-20 pt-10 sm:px-6 lg:px-8">

        <!-- Back Button -->
        <nav class="muted mb-6 text-sm">

            <a href="./laptops.html" class="accent-text">
                ← Back to laptops
            </a>

        </nav>

        <!-- Laptop Information -->
        <div id="details-content">
            <!-- JavaScript generates laptop details here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t py-8">

        <div class="mx-auto flex max-w-7xl flex-col justify-between gap-2 px-4 text-sm muted sm:flex-row sm:px-6 lg:px-8">

            <span>© 2026 CampusGear · Built for students</span>
            <span>SW302 · JavaScript + Tailwind CSS 4</span>

        </div>

    </footer>

    <!-- Notification -->
    <div id="toast"
         class="fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-xl px-5 py-3 text-sm font-semibold shadow-2xl"
         role="status">
    </div>

    <script type="module" src="./src/js/details.js"></script>

</body>
</html>
